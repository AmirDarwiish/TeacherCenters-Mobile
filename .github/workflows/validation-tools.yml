name: Prepare offline validation tools
on:
  push:
    paths: ['.github/workflows/validation-tools.yml', '.github/tooling/validation-dependencies.csproj']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: offline-validation-tools
          run-id: 39733301034
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: split -b 250M -d validation-tools.tar.gz tooling.part.
      - uses: actions/upload-artifact@v4
        with:
          name: validation-tools-00
          path: tooling.part.00
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: validation-tools-01
          path: tooling.part.01
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: validation-tools-02
          path: tooling.part.02
          retention-days: 2
