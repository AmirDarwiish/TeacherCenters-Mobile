name: Flutter checks and Android APK
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-mobile-source
          path: |
            lib/
            test/
            pubspec.lock
          retention-days: 2
      - run: flutter analyze
      - run: flutter test --dart-define=SCREENSHOTS=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-review
          path: docs/screenshots/*.png
          retention-days: 14
      - run: flutter build apk --release --dart-define=TENANT_SLUG=teachercenter-demo
      - uses: actions/upload-artifact@v4
        with:
          name: teachercenters-preview-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
