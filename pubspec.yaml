name: teacher_centers_mobile
description: Rewaq — lessons, groups, attendance and payments.
publish_to: none
version: 1.8.0+11
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^4.15.2
  firebase_messaging: ^16.7.1
  dio: ^5.8.0+1
  geolocator: ^14.0.2
  camera: ^0.12.1
  http_parser: ^4.1.2
  flutter_secure_storage: ^9.2.4
  intl: any
  timezone: ^0.11.0
  lucide_icons_flutter: ^4.0.1
  qr_flutter: ^4.1.0
  video_player: ^2.9.5
  url_launcher: ^6.3.1
  file_picker: ^10.1.9
  signalr_netcore: ^1.4.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    - family: Alexandria
      fonts:
        - asset: assets/fonts/Alexandria.ttf
          weight: 600
        - asset: assets/fonts/Alexandria.ttf
          weight: 700
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
